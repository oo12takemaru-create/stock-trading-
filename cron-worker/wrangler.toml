name = "ruletrade-cron"
main = "src/index.js"
compatibility_date = "2026-09-09"

# ★Cron Trigger は2本だけ★
#   無料プランはアカウントあたり5本まで。時刻ごとに1本ずつ割り当てると
#   足りない（実際の時間帯は9系統ある）ので、原則1本で起こして
#   Worker の中で JST を見て振り分ける。
#   起動時刻を足したいときは src/index.js の PLAN に1行足すだけでよく、
#   ここは触らない。
#
#   2本目は :15/:45 を発火させるためのもの。realtime-signal の15分間隔
#   （引継ぎ.md §21）と、朝のダイジェスト（JST 7:15）に要る。
#
#   ★曜日も時間帯も絞らない★（2026-09-11 に踏んだ罠・§23-10）
#   以前は "15,45 0-6 * * 1-5" と書いていたが、**Cloudflare の cron は
#   曜日が 1=日曜 〜 7=土曜**（Quartz 風）で、標準 cron の 1=月曜 とずれる。
#   "1-5" は月〜金のつもりが **日〜木** を指しており、**金曜だけ発火しなかった**。
#   さらに JST 7:15 は UTC 22:15 で、時間帯 "0-7" の外にも出てしまう。
#   → 絞るのをやめて Worker 側の PLAN と isTradingDay() に任せる。
#     土日や予定の無い分は targets が空で即 return するだけ（費用はゼロ）。
#
#   Cloudflare の cron は UTC。1本目は毎時なので時差の計算が要らない。
[triggers]
#   会員向けの朝の通知（JST 7:30・引継ぎ.md §19 相談⑨）も 1本目から出す。
#   :30 は既に発火しているので trigger は増やさない（枠は5本しかない）。
crons = [
  "0,30 * * * *",        # 常用: PLAN による振り分け＋朝の通知（7:30）
  "15,45 * * * *",       # :15/:45 の枠（ザラ場の15分間隔＋朝7:15のダイジェスト）
]

# 秘密は wrangler secret put で入れる（このファイルには書かない）
#   npx wrangler secret put GH_PAT
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put NOTIFY_TO
#   npx wrangler secret put CRON_SECRET
