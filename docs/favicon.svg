<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BNF×Minervini">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16294c"/>
      <stop offset="1" stop-color="#0a1426"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d4a843"/>
      <stop offset="1" stop-color="#f4dca0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="#2a3f63" stroke-width="1.5"/>
  <!-- 上昇する棒(控えめ) -->
  <g fill="url(#gold)" opacity="0.30">
    <rect x="13" y="38" width="7" height="13" rx="2"/>
    <rect x="25" y="31" width="7" height="20" rx="2"/>
    <rect x="37" y="23" width="7" height="28" rx="2"/>
  </g>
  <!-- トレンドライン(上昇) -->
  <polyline points="12,43 24,35 33,40 49,19" fill="none" stroke="url(#gold)"
            stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 矢じり -->
  <path d="M43 17 L52 15 L51 24 Z" fill="url(#gold)"/>
</svg>
