name: Radar Publish (kaburadar.jp)

# docs/radar.json（株レーダーの地合い判定）を公開する。
#
# ■ なぜ daily-signal.yml から独立させたか（2026-08-17）
#   もともと daily-signal.yml の中に radar.json 公開ステップを入れていたが、
#   2026-08-13 に別の開発フロー（「feat: 朝ダイジェスト+クラウド同期」）が
#   daily-signal.yml を丸ごと上書きし、そのステップが消えて
#   radar.json が4日間更新されないまま気づかれなかった。
#   → daily-signal.yml には一切触らず、その完了を待って
#     artifact の signal.json から radar.json を作る独立フローにする。
#     これで daily-signal.yml が今後何度上書きされても地合いは止まらない。
#
# ■ 予備 cron について（指示書 §14-2 / 引継ぎ.md §19「発見 2026-09-09」）
#   このワークフローは daily-signal の完了で起動するので、
#   daily-signal 自体が起動しなかった日は radar.json も出ない。
#   他の3本と同じ「本命の60〜90分後に予備 cron」を、
#   **daily-signal には触らないまま**入れるために、schedule を足して
#   下の「Resolve source run id」の手動実行用の分岐
#   （最後に成功した daily-signal を探す）に相乗りさせる。
#   当日ぶんが既に出ていれば、下の冪等ガードで何もせず終わる。
on:
  workflow_run:
    workflows: ["Daily Trading Signal (v2.8.1)"]
    types: [completed]
  schedule:
    - cron: '0 8 * * 1-5'    # 予備: 予定 17:00 JST / 狙い 20:00 JST（3時間前倒し）
  # pipeline-*.yml から順序付きで呼べるようにする（2026-09-09・実行基盤）
  # 既存の schedule / workflow_dispatch はそのまま残す
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: radar-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # スキャナーが失敗した回は signal.json が信頼できないのでスキップ
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ★main のルールセットを通すため deploy key で checkout する★
          #   bypass に入れられるのは Deploy key だけなので、GITHUB_TOKEN の
          #   push（github-actions[bot]）は「PR 必須」に弾かれる。
          #   ★DEPLOY_KEY が未設定なら空文字＝無視され、今までどおり token で動く。★
          #   （actions/checkout は ssh-key が空なら token 経路に落ちる）
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ★予備実行の冪等ガード（他3本と同じ考え方）
      #   本命（daily-signal の完了）で既に当日ぶんが出ているなら何もしない。
      #   手動実行は意図的な再実行なのでスキップしない。
      - name: Skip if already fresh (予備実行のみ)
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "予備 cron 以外なのでスキップ判定をしません"
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if python check_freshness.py --target radar; then
            echo "当日ぶんは公開済み。以降のステップを飛ばします"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "未公開または古いので実行します"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # ★パイプライン（pipeline-daily の workflow_call）の中では、同じ実行の daily-signal ジョブが
      #   signal-* の artifact をこの実行に上げている。まずそれを使う（2026-10-07）。
      #   以前は「最後に成功した daily-signal」を gh run list で探していたが、--status=success の
      #   一覧が新しい順にならず、30日の保存期限が切れた9月の実行（36153780162）をつかんで
      #   "no valid artifacts found" で失敗していた。radar-publish が落ちると後ろの
      #   傾斜計・着火・決算・空売り・前計算・点検が全部スキップされる（9/24〜10/7 に頻発）。
      - name: Download signal artifact from this run (パイプライン内)
        id: same
        if: steps.guard.outputs.skip != 'true' && github.event.workflow_run.id == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: signal-*
          path: artifacts

      - name: Resolve source run id
        id: src
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ -n "$(find artifacts -name signal.json 2>/dev/null | head -1)" ]; then
            echo "この実行の artifact を使います（パイプライン内）"
            echo "id=" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.workflow_run.id }}" ]; then
            echo "id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          else
            # 手動実行時は最後に成功した daily-signal を使う（作成日時の新しい順を API で明示）
            RID=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-signal.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
            echo "id=$RID" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download signal.json artifact
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ -n "${{ steps.src.outputs.id }}" ]; then
            gh run download "${{ steps.src.outputs.id }}" -D artifacts
          fi
          SIG=$(find artifacts -name signal.json | sort | tail -1)
          if [ -z "$SIG" ]; then
            echo "::error::signal.json が artifact に見つかりません（run ${{ steps.src.outputs.id || github.run_id }}）"
            exit 1
          fi
          cp "$SIG" signal.json
          echo "使用: $SIG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish radar.json (競合時はリベースして再試行)
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            python make_radar_json.py signal.json docs/radar.json
            git add -f docs/radar.json docs/radar_history.json
            if git diff --staged --quiet; then
              echo "変更なし → 完了"
              exit 0
            fi
            git commit -m "📡 地合い判定を公開（radar.json）"
            if git push; then
              echo "✓ 公開成功（試行${i}回目）"
              exit 0
            fi
            echo "push失敗（試行${i}/3）→ 再試行"
            sleep 7
          done
          echo "::error::3回試行してもpushできませんでした"
          exit 1
