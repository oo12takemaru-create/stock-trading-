name: Data Healthcheck (kaburadar.jp)

# 公開JSONが古くなっていないかを毎日チェックし、古ければIssueで通知する。
# 「更新が止まったことに気づけない」のを防ぐための監視。
# 毎日 23:43 JST (= 14:43 UTC) に実行。
# しきい値0(当日更新必須)にしたので、その日の全ジョブが終わった後に走らせる必要がある。
# 最も遅いのは gauge-daily の 21:23 JST。21:13 に見ていた頃は
# 傾斜計・着火が「まだ走っていないだけ」で誤検知した。
on:
  schedule:
    - cron: '43 14 * * *'          # 23:43 JST: その日の全ジョブ終了後にIssueで通知
    # ★翌朝 7:00 JST (= 前日 22:00 UTC) の締めチェック（指示書 §14-2 / Fable 2026-09-09）
    #   予備 cron でも埋まらなかった場合に、**ジョブを失敗させて**気づけるようにする。
    #   23:43 の回は Issue を立てるだけで success のままなので、
    #   Actions の一覧を見ても異常が分からなかった（2026-09-05 の欠落が4日間放置された）。
    - cron: '0 22 * * 0-4'         # 朝 07:00 JST(月〜金)
  # pipeline-*.yml から呼ぶ（2026-09-09・実行基盤）。
  # このファイルは check と morning-gate の2ジョブを持ち、今までは
  # github.event.schedule の値で振り分けていた。workflow_call だと
  # event.schedule が無く**両方走ってしまう**ので、mode で選ばせる。
  workflow_call:
    inputs:
      mode:
        description: 'check（データ点検）か morning（前営業日ぶんの関門）か'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      test_stale:
        description: 'テスト用: 止まったことにする表示名（本番のJSONは触らない。Issueは立てず ntfy だけ送る）'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write

jobs:
  check:
    # 23:43 の回だけ。朝7:00の回でここを動かすと、tol=0（当日更新必須）の判定が
    # 「前日の夜に更新済み＝1営業日前」を古いとみなして誤ってIssueを立てる。
    #
    # ★github.event_name では workflow_call を見分けられない★
    #   呼ばれる側から見た event_name は**呼び出し元のイベント**（パイプラインは
    #   workflow_dispatch）になる。'workflow_call' という値には決してならない。
    #   そのため判定は inputs.mode の有無で行う。
    #   schedule と素の workflow_dispatch では inputs.mode は空文字になる。
    if: >-
      inputs.mode == 'check'
      || (inputs.mode == ''
          && (github.event_name == 'workflow_dispatch'
              || github.event.schedule == '43 14 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ★ref: main（2026-10-08）★ パイプラインから呼ばれると、既定では**パイプラインが始まった
          #   時点のコミット**を取り出す。同じ回で着火・決算などが更新した分が見えず、
          #   「1営業日前が最新」と誤報していた（10/7 21:00 の回で判明。9/30〜10/6 の
          #   18:00 の回の点検の失敗も同じ原因の可能性が高い）。点検は常に最新の main を見る。
          ref: main
          # 中身の点検が「前営業日はどうだったか」を git の履歴から読むため、
          # 浅いclone（既定の depth:1）では足りない。
          fetch-depth: 0

      - name: Check data freshness
        id: chk
        env:
          TEST_STALE: ${{ inputs.test_stale }}
        run: |
          python - <<'PY' > report.md
          import json, sys
          # ★鮮度の基準表は data_targets.py に1本化した★
          #   トップのバッジ（make_board.py）と同じ表を使う。2か所に書くと必ずずれる。
          from data_targets import TARGETS, ref_date, bizdays_between
          from datetime import datetime, timezone, timedelta
          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          today = ref_date(now)

          problems = []
          rows = []
          for path, label, tol in TARGETS:
              try:
                  d = json.load(open(path, encoding="utf-8"))
              except Exception as e:
                  problems.append(f"{label}: 読込失敗 ({e})")
                  rows.append(f"| {label} | ❌ 読込失敗 | - |")
                  continue
              # ★asof しか持たないファイルがある★（2026-09-23）
              #   equity_curve.json / builder_example.json は updated ではなく asof。
              #   updated を優先し、無いときだけ asof を見る（既存23本の挙動は不変）。
              #   これを足さずに一覧へ入れると「日付不明」で毎日赤くなる。
              #   赤が常態化すると本当の異常に気づけない（手元で実際に踏んだ）。
              upd = (d.get("updated") or (d.get("latest") or {}).get("updated")
                     or d.get("asof") or "")
              try:
                  dt = datetime.fromisoformat(upd).date()
                  age = bizdays_between(dt, today)   # 営業日ベース
              except Exception:
                  problems.append(f"{label}: updated が読めない ({upd!r})")
                  rows.append(f"| {label} | ❌ 日付不明 | {upd} |")
                  continue
              ok = age <= tol
              if not ok:
                  problems.append(f"{label}: {age}営業日前が最新 (許容{tol}営業日)")
              rows.append(f"| {label} | {'✅' if ok else '⚠️ 古い'} | {upd[:16]} ({age}営業日前) |")

          # テスト用（workflow_dispatch の test_stale）。本番のJSONは触らず、問題を1件足すだけ
          import os
          t = os.environ.get("TEST_STALE", "").strip()
          if t:
              problems.append(f"{t}: 【テスト】止まったことにしています（実際のデータは正常）")

          print(f"## 株レーダー データ鮮度チェック ({now:%Y-%m-%d %H:%M} JST)\n")
          print("| データ | 状態 | 最終更新 |")
          print("|---|---|---|")
          print("\n".join(rows))
          if problems:
              print("\n### ⚠️ 要対応\n")
              for p in problems:
                  print(f"- {p}")
          PY
          cat report.md >> $GITHUB_STEP_SUMMARY
          if grep -q "要対応" report.md; then echo "stale=true" >> $GITHUB_OUTPUT; else echo "stale=false" >> $GITHUB_OUTPUT; fi

      # 鮮度だけでは「毎日更新されているのに中身は失敗」を捕まえられない。
      # FREDが2026-08-15から落ちていたのに1か月気づけなかったのがこれ（Issue化されず）。
      - name: Check data content (中身が失敗していないか)
        id: content
        run: |
          if python -X utf8 healthcheck_content.py > content.md; then
            echo "broken=false" >> $GITHUB_OUTPUT
          else
            echo "broken=true" >> $GITHUB_OUTPUT
          fi
          cat content.md
          cat content.md >> $GITHUB_STEP_SUMMARY
          cat content.md >> report.md

      # ★パイプラインから呼ばれたとき（mode: check）は Issue を立てない★
      #   23:43 の回と合わせて同じ内容の Issue が1日2本立つ。
      #   「二重通知は欠落より悪い」（引継ぎ.md §19-7）の原則に反する。
      - name: Open issue when stale (単独実行の回だけ)
        if: >-
          (steps.chk.outputs.stale == 'true' || steps.content.outputs.broken == 'true')
          && inputs.mode != 'check' && inputs.test_stale == ''
        uses: peter-evans/create-issue-from-file@v5
        with:
          # 鮮度と中身で別々にIssueを立てると同じ晩に2本並ぶので、1本にまとめる
          # （「二重通知は欠落より悪い」引継ぎ.md §19-7）。report.md に両方入っている。
          title: "⚠️ 株レーダー: データに異常があります（更新停止または中身の失敗）"
          content-filepath: report.md
          labels: data-alert

      # ★スマホに届く通知（ntfy）・2026-10-07 起動文 積上①★
      #   Issue は本人が GitHub を開かないと見えない。空売り・信用残・朝刊の停止は
      #   10日・10日・4日気づけなかった。朝刊と同じ NTFY_TOPIC に送り、翌朝には分かるようにする。
      #   送るのは単独実行（23:30 の Worker／23:43 の schedule）の回だけ。パイプライン内（mode: check）は
      #   ジョブを失敗させるだけで送らない＝同じ内容を1日に2回送らない（二重通知は欠落より悪い・§19-7）。
      #   23:30 と 23:43 が両方走った日に2通にならないよう、送った印を Actions の cache に置く。
      - name: Already notified today?
        id: sent
        if: >-
          (steps.chk.outputs.stale == 'true' || steps.content.outputs.broken == 'true')
          && inputs.mode != 'check'
        run: echo "key=ntfy-healthcheck-$(TZ=Asia/Tokyo date +%F)${{ inputs.test_stale != '' && '-test' || '' }}" >> "$GITHUB_OUTPUT"

      - name: Restore notified mark
        id: mark
        if: steps.sent.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: .ntfy-sent
          key: ${{ steps.sent.outputs.key }}

      - name: Notify (ntfy)
        if: steps.sent.outputs.key != '' && steps.mark.outputs.cache-hit != 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "::warning::NTFY_TOPIC 未設定のため通知できません"; exit 0; fi
          python - <<'PY'
          import json, os, re, urllib.request
          rep = open("report.md", encoding="utf-8").read()
          # 「要対応」の見出しの下の箇条書きだけ（鮮度・中身の両方）
          lines = []
          for block in re.split(r"\n### ", rep)[1:]:
              if block.startswith("⚠️ 要対応"):
                  lines += [l[2:].replace("**", "") for l in block.splitlines() if l.startswith("- ")]
          names = []
          for l in lines:
              n = re.split(r"[:：]", l, 1)[0].strip()
              if n and n not in names:
                  names.append(n)
          title = "⚠️ 株レーダー: " + "・".join(names[:4]) + (f" ほか{len(names) - 4}件" if len(names) > 4 else "")
          body = "\n".join(lines)[:1500] or "（要対応の行を取り出せませんでした）"
          run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          urllib.request.urlopen(urllib.request.Request(
              "https://ntfy.sh",
              data=json.dumps({"topic": os.environ["NTFY_TOPIC"], "title": title, "message": body,
                               "priority": 4, "tags": ["warning"], "click": run}).encode("utf-8"),
              headers={"Content-Type": "application/json"}), timeout=30)
          print("ntfy送信OK:", title)
          PY
          mkdir -p .ntfy-sent && date > .ntfy-sent/at

      - name: Save notified mark
        if: steps.sent.outputs.key != '' && steps.mark.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ntfy-sent
          key: ${{ steps.sent.outputs.key }}

      # パイプライン内では Issue の代わりに**ジョブを失敗させる**。
      # morning-gate と同じ考え方（Issue を立てるだけだと Actions の一覧が
      # success のままなので異常に気づけない・2026-09-05 の4日間放置）。
      # 失敗すれば pipeline-daily 全体が failure になり、summary とメールに出る。
      - name: Fail when stale (パイプライン内)
        if: >-
          (steps.chk.outputs.stale == 'true' || steps.content.outputs.broken == 'true')
          && inputs.mode == 'check'
        run: |
          echo "::error::公開JSONが古い、または中身が失敗しています。パイプラインを失敗として記録します"
          cat report.md
          exit 1


  # ─────────────────────────────────────────────
  #  翌朝の締めチェック（指示書 §14-2 / 引継ぎ.md §19「発見 2026-09-09」）
  #
  #  上の check ジョブは Issue を立てるだけで、ジョブ自体は success になる。
  #  そのため Actions の一覧を眺めても異常に気づけず、2026-09-05 に
  #  free-scanner が起動しなかったことが4日間放置された。
  #
  #  こちらは **前営業日ぶんが無ければジョブを失敗させる**。
  #  本命 cron → 予備 cron でも埋まらなかった、という最後の砦。
  # ─────────────────────────────────────────────
  morning-gate:
    # 朝7:00の回だけ動かす（23:43 の回は上の check だけでよい）
    # （判定を inputs.mode で行う理由は check ジョブの注記を参照）
    # 素の workflow_dispatch では上の check だけが走る（今までどおり）。
    if: >-
      inputs.mode == 'morning'
      || (inputs.mode == '' && github.event.schedule == '0 22 * * 0-4')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main   # 上の check と同じ理由（パイプラインの開始時点ではなく最新を見る）

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 前営業日ぶんが揃っているか
        run: |
          fail=0
          for t in free_scanner market_jiai radar portfolio_stats equity_curve signals_log; do
            if python check_freshness.py --target "$t"; then
              echo "  OK"
            else
              echo "::error::$t が前営業日ぶんまで更新されていません（本命・予備とも取りこぼした可能性）"
              fail=1
            fi
            echo "---"
          done
          exit $fail
