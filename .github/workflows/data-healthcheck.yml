name: Data Healthcheck (kaburadar.jp)

# 公開JSONが古くなっていないかを毎日チェックし、古ければIssueで通知する。
# 「更新が止まったことに気づけない」のを防ぐための監視。
# 毎日 23:43 JST (= 14:43 UTC) に実行。
# しきい値0(当日更新必須)にしたので、その日の全ジョブが終わった後に走らせる必要がある。
# 最も遅いのは gauge-daily の 21:23 JST。21:13 に見ていた頃は
# 傾斜計・着火が「まだ走っていないだけ」で誤検知した。
on:
  schedule:
    - cron: '43 14 * * *'          # 23:43 JST: その日の全ジョブ終了後にIssueで通知
    # ★翌朝 7:00 JST (= 前日 22:00 UTC) の締めチェック（指示書 §14-2 / Fable 2026-09-09）
    #   予備 cron でも埋まらなかった場合に、**ジョブを失敗させて**気づけるようにする。
    #   23:43 の回は Issue を立てるだけで success のままなので、
    #   Actions の一覧を見ても異常が分からなかった（2026-09-05 の欠落が4日間放置された）。
    - cron: '0 22 * * 0-4'         # 朝 07:00 JST(月〜金)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    # 23:43 の回だけ。朝7:00の回でここを動かすと、tol=0（当日更新必須）の判定が
    # 「前日の夜に更新済み＝1営業日前」を古いとみなして誤ってIssueを立てる。
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 14 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check data freshness
        id: chk
        run: |
          python - <<'PY' > report.md
          import json, sys
          from datetime import datetime, timezone, timedelta
          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          # 23:43のcronがGitHub側の遅延で日付をまたぐと、金曜更新の日次データが
          # 月曜0時に「1営業日前」と誤検知される（2026-08-24 Issue #321で実際に発生）。
          # 「その晩のチェック」として評価するため、7時間引いた時点の日付を基準にする。
          today = (now - timedelta(hours=7)).date()

          def bizdays_between(d1, d2):
              """d1→d2 の営業日数（土日を除く。祝日は考慮しない=安全側に厳しめ）"""
              n, cur = 0, d1
              while cur < d2:
                  cur += timedelta(days=1)
                  if cur.weekday() < 5:
                      n += 1
              return n

          # (ファイル, 表示名, 許容遅れ営業日数)
          # 0 = 当日更新されていること。21:13 JSTチェックなので日次データは当日分が出ている前提。
          #     祝日は誤検知しうるが「気づけない」より軽い害として受け入れる。
          TARGETS = [
              ("docs/heatmap.json",       "ヒートマップ/出来高", 0),
              ("docs/radar.json",         "地合い判定",         0),
              ("docs/ai_analysis.json",   "AI朝刊",             0),
              ("docs/score3.json",       "3軸スコア",          0),
              ("docs/cot.json",           "投機筋(COT)",        6),
              ("docs/investor_flow.json", "投資部門別",         6),
              ("docs/tenbagger.json",     "十倍株スキャナー",   6),
              ("docs/karauri.json",       "空売り残高",         2),
              ("docs/kessan.json",        "決算カレンダー",     2),
              ("docs/gauge.json",         "暴落の傾斜計",       0),
              ("docs/crash.json",         "着火判定",           0),
              ("docs/shinyo.json",        "信用取引の需給",     6),
              ("docs/shinyo_meigara.json","銘柄別信用残",       6),
              ("docs/ai_record.json",     "AI・地合いの成績表", 2),
              ("docs/sector_record.json", "セクター答え合わせ", 2),
              ("docs/buyback.json",       "自社株買い開示",     2),
              ("docs/karauri_score.json","空売りの答え合わせ",  9),
              ("docs/cot_score.json",    "投機筋の答え合わせ",  9),
              ("docs/ai_weekly.json",     "週末版AI",           8),
          ]
          problems = []
          rows = []
          for path, label, tol in TARGETS:
              try:
                  d = json.load(open(path, encoding="utf-8"))
              except Exception as e:
                  problems.append(f"{label}: 読込失敗 ({e})")
                  rows.append(f"| {label} | ❌ 読込失敗 | - |")
                  continue
              upd = d.get("updated") or (d.get("latest") or {}).get("updated") or ""
              try:
                  dt = datetime.fromisoformat(upd).date()
                  age = bizdays_between(dt, today)   # 営業日ベース
              except Exception:
                  problems.append(f"{label}: updated が読めない ({upd!r})")
                  rows.append(f"| {label} | ❌ 日付不明 | {upd} |")
                  continue
              ok = age <= tol
              if not ok:
                  problems.append(f"{label}: {age}営業日前が最新 (許容{tol}営業日)")
              rows.append(f"| {label} | {'✅' if ok else '⚠️ 古い'} | {upd[:16]} ({age}営業日前) |")

          print(f"## 株レーダー データ鮮度チェック ({now:%Y-%m-%d %H:%M} JST)\n")
          print("| データ | 状態 | 最終更新 |")
          print("|---|---|---|")
          print("\n".join(rows))
          if problems:
              print("\n### ⚠️ 要対応\n")
              for p in problems:
                  print(f"- {p}")
          PY
          cat report.md >> $GITHUB_STEP_SUMMARY
          if grep -q "要対応" report.md; then echo "stale=true" >> $GITHUB_OUTPUT; else echo "stale=false" >> $GITHUB_OUTPUT; fi

      - name: Open issue when stale
        if: steps.chk.outputs.stale == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "⚠️ 株レーダー: データ更新が止まっています"
          content-filepath: report.md
          labels: data-alert


  # ─────────────────────────────────────────────
  #  翌朝の締めチェック（指示書 §14-2 / 引継ぎ.md §19「発見 2026-09-09」）
  #
  #  上の check ジョブは Issue を立てるだけで、ジョブ自体は success になる。
  #  そのため Actions の一覧を眺めても異常に気づけず、2026-09-05 に
  #  free-scanner が起動しなかったことが4日間放置された。
  #
  #  こちらは **前営業日ぶんが無ければジョブを失敗させる**。
  #  本命 cron → 予備 cron でも埋まらなかった、という最後の砦。
  # ─────────────────────────────────────────────
  morning-gate:
    # 朝7:00の回だけ動かす（23:43 の回は上の check だけでよい）
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 22 * * 0-4'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 前営業日ぶんが揃っているか
        run: |
          fail=0
          for t in free_scanner market_jiai radar portfolio_stats signals_log; do
            if python check_freshness.py --target "$t"; then
              echo "  OK"
            else
              echo "::error::$t が前営業日ぶんまで更新されていません（本命・予備とも取りこぼした可能性）"
              fail=1
            fi
            echo "---"
          done
          exit $fail
