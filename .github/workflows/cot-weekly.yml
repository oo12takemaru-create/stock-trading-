name: COT Weekly (kaburadar.jp)

# CFTC建玉報告(投機筋ポジション)を毎週土曜 8:05 JST に取得して docs/cot.json に公開
# (CFTCの公表は金曜15:30 ET = 土曜 4:30-5:30 JST)
# JST 土曜08:05 = UTC 金曜23:05 → cron '5 23 * * 5'
on:
  schedule:
    - cron: '5 23 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch COT data
        run: |
          python cot_fetch.py docs/cot.json

      - name: Commit cot.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/cot.json
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "📊 投機筋ポジション(COT)を更新"
          git pull --rebase origin main
          git push
