name: COT Weekly (kaburadar.jp)

# CFTC建玉報告(投機筋ポジション)を毎週土曜 8:05 JST に取得して docs/cot.json に公開
# (CFTCの公表は金曜15:30 ET = 土曜 4:30-5:30 JST)
# JST 土曜08:05 = UTC 金曜23:05 → cron '5 23 * * 5'
on:
  schedule:
    - cron: '5 23 * * 5'
  # pipeline-*.yml から順序付きで呼べるようにする（2026-09-09・実行基盤）
  # 既存の schedule / workflow_dispatch はそのまま残す
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ★main のルールセットを通すため deploy key で checkout する★
          #   bypass に入れられるのは Deploy key だけなので、GITHUB_TOKEN の
          #   push（github-actions[bot]）は「PR 必須」に弾かれる。
          #   ★DEPLOY_KEY が未設定なら空文字＝無視され、今までどおり token で動く。★
          #   （actions/checkout は ssh-key が空なら token 経路に落ちる）
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch COT data
        run: |
          python cot_fetch.py docs/cot.json

      - name: Commit cot.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/cot.json
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "📊 投機筋ポジション(COT)を更新"
          git pull --rebase origin main
          git push
