name: Similar Weekly (そっくり銘柄・真逆銘柄)

# 全銘柄の日次騰落率（直近250営業日・分割調整済みの終値）の総当たりの相関から、銘柄ごとに
# 似ている10・逆に動く10を docs/similar/{コード}.json に書く（similar_weekly.py・2026-11-20）。
# 株レーダーの銘柄ページ（stocks/{コード}.html）の節が読む。
# 元データは収集側にもう貯まっている data/bars_backfill・data/bars だけ（新しい取得なし・数十秒）。
# 金曜の足（movers-daily 18:07 JST の Daily bars）の後、土曜の朝に1回＋保険1回。中身が同じなら書かない。
on:
  schedule:
    - cron: '23 0 * * 6'    # 土 09:23 JST
    - cron: '23 5 * * 6'    # 土 14:23 JST（保険・中身が同じなら何もしない）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: similar-weekly
  cancel-in-progress: false

jobs:
  similar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ★main のルールセットを通すため deploy key で checkout する（heatmap.yml の注記参照）★
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -q numpy

      - name: Build docs/similar
        run: python -X utf8 similar_weekly.py

      # 決算発表のあと、過去はどう動いたか（決算またぎ帳・kessan_ato.py・2026-11-29）。
      # 同じ data/bars を読むだけ（新しい取得なし・十数秒）。決算のあった銘柄のファイルだけ書き換わる。失敗しても similar は出す
      - name: Build docs/kessan_ato
        run: python -X utf8 tests/test_kessan_ato.py && python -X utf8 kessan_ato.py || echo "::warning::kessan_ato.py が失敗（similar は公開する）"

      - name: Commit docs/similar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -A docs/similar   # docs/*.json は .gitignore 対象なので -f。消えた銘柄のファイルも -A で消す
          git add -f -A docs/kessan_ato 2>/dev/null || true   # 決算またぎ帳（2026-11-29・無い回は飛ばす）
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "🧬 そっくり銘柄・真逆銘柄を更新（週次）"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && { echo "✓ push 成功（試行${i}回目）"; exit 0; }
            echo "push 失敗。${i}回目のリトライ待ち"
            sleep $((i * 10))
          done
          echo "::error::push に5回失敗しました"
          exit 1
