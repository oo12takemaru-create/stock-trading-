name: Precompute Metrics (日次差分)

# ルールビルダーの前計算テーブルを毎営業日1回だけ更新する。
# 既存の daily-signal.yml（JST 18:00 = UTC 09:00）の後ろに置く。
#   JST 18:30 = UTC 09:30 → cron: '30 9 * * 1-5'
#
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   SUPABASE_URL                … https://xxxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   … service_role キー
# テーブルは ruletrade-app/supabase/schema.sql を SQL Editor で先に流しておくこと。
on:
  schedule:
    - cron: '30 9 * * 1-5'    # 夕 18:30 JST(月〜金)
  workflow_dispatch:
    inputs:
      days:
        description: '直近何営業日ぶんを upsert するか'
        required: false
        default: '5'

permissions:
  contents: write

concurrency:
  group: precompute-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update daily_metrics / market_condition
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # ★ python ... | tee は tee の終了コードになるので、失敗が success になる。
          #    pipefail を付けて Python の失敗をそのまま落とす（2026-09-06 に実際に踏んだ）。
          set -o pipefail
          python precompute/update_metrics.py \
            --days "${{ github.event.inputs.days || '5' }}" \
            | tee update.log

      # 規定値ポートフォリオの成績（＝サイトの公開数字と同じ計算）を作り直す。
      # 分割利確・サーキットブレーカー・同セクター上限を含むので Python が正本。
      - name: Rebuild preset portfolio result
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # ★ python ... | tee は tee の終了コードになるので、失敗が success になる。
          #    pipefail を付けて Python の失敗をそのまま落とす（2026-09-06 に実際に踏んだ）。
          set -o pipefail
          python precompute/build_portfolio.py | tee -a update.log

      # 規定値の調整域（企画書v2 §4-2 の1,260通り）を先に計算しておく。
      # 会員がスライダーを動かした瞬間に返るのはこの範囲（引継ぎ.md §19 相談④）。
      # ★キャッシュのキーは TypeScript 側（params.ts）と一致している必要がある。
      #   ズレるとエラーにならず「毎回遅い」だけなので、
      #   precompute/tests/verify_cache_key.py で確かめること。
      - name: Warm preset adjustment cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          python precompute/warm_cache.py | tee -a update.log

      # 公開数字を1枚の JSON にして GitHub Pages で配る。
      # 静的サイト（ruletrade.jp）と会員アプリ /dashboard がこの同じ値を見る
      # ＝「一つの定義・一つの数字」（引継ぎ.md §19・起動文 2-4c）。
      - name: Publish portfolio_stats.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            python precompute/export_portfolio_json.py
            git add -f docs/portfolio_stats.json
            if git diff --staged --quiet; then
              echo "変更なし → 完了"
              exit 0
            fi
            git commit -m "📊 公開数字を更新（portfolio_stats.json）"
            if git push; then
              echo "✓ 公開成功（試行${i}回目）"
              exit 0
            fi
            echo "push失敗（試行${i}/3）→ 再試行"
            sleep 7
          done
          echo "::error::3回試行してもpushできませんでした"
          exit 1

      - name: Write summary
        if: always()
        run: |
          echo "## 前計算テーブル 日次更新" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 実行時刻: $(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M') JST" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 update.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
