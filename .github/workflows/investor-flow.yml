name: Investor Flow Weekly (kaburadar.jp)

# JPX投資部門別売買状況(週間)を毎週木曜16:05 JSTに取得して docs/investor_flow.json に公開
# (JPXの公表は木曜15:00ごろ) JST木曜16:05 = UTC木曜07:05 → cron '5 7 * * 4'
on:
  schedule:
    - cron: '5 7 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ★main のルールセットを通すため deploy key で checkout する★
          #   bypass に入れられるのは Deploy key だけなので、GITHUB_TOKEN の
          #   push（github-actions[bot]）は「PR 必須」に弾かれる。
          #   ★DEPLOY_KEY が未設定なら空文字＝無視され、今までどおり token で動く。★
          #   （actions/checkout は ssh-key が空なら token 経路に落ちる）
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # numpy/scipy/yfinance は答え合わせ(investor_score.py)の分
        run: pip install pandas xlrd numpy scipy yfinance

      - name: Fetch investor flow
        run: python investor_flow.py docs/investor_flow.json

      - name: Append this week to history / rescore
        # 557本のExcelは取り直さない。直前の investor_flow.json をそのまま1週ぶん足すだけ。
        # 価格の取得(yfinance)が転んでも週次の本体は落とさない。履歴と答え合わせは
        # 対で持ちたいので、片方でも失敗したら両方とも元に戻して今週は見送る。
        run: |
          python -X utf8 investor_hist_append.py && python -X utf8 investor_score.py || {
            echo "::warning::履歴の追記か答え合わせに失敗。今週は investor_flow.json だけ更新する"
            git checkout -- docs/investor_hist.json docs/investor_score.json
          }

      - name: Commit investor_flow.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/investor_flow.json docs/investor_hist.json docs/investor_score.json
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "🏦 投資部門別売買状況を更新（履歴・答え合わせも再計算）"
          git pull --rebase origin main
          git push
