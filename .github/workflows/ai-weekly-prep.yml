name: AI Weekly Prep (data → prompt branch)

# 2026-10-05〜 週末版AIの前段（ai-morning-prep.yml と同じ型）。
#   routine のクラウド環境は外向きHTTPSが遮断されているため、データ取りとプロンプト作成はここで行う。
#   weekly.py --prompt-out の結果 PROMPT.txt をブランチ ai-prompt/YYYY-MM-DD-<sat|sun> に載せる。
#   routine はそれを checkout して回答（ai_answer.json）を書き、ai-weekly/YYYY-MM-DD-<mode> に push
#   → ai-weekly-ingest.yml が main へ取り込む。
#   古い ai-prompt/* の掃除は ai-morning-prep.yml が行う。
on:
  schedule:
    - cron: '0 23 * * 5'      # 23:00 UTC(金) = 8:00 JST(土) → sat
    - cron: '0 23 * * 6'      # 23:00 UTC(土) = 8:00 JST(日) → sun
  workflow_dispatch:
    inputs:
      mode:
        description: 'sat=答え合わせ / sun=来週の想定'
        required: true
        default: 'sat'

permissions:
  contents: write

concurrency:
  group: ai-weekly-prep
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decide mode
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          M="$INPUT_MODE"
          if [ -z "$M" ]; then
            W=$(TZ='Asia/Tokyo' date +%u)   # 6=土, 7=日
            if [ "$W" = "6" ]; then M=sat; elif [ "$W" = "7" ]; then M=sun; else
              echo "::error::平日に起動されました（mode を指定してください）"; exit 1
            fi
          fi
          case "$M" in sat|sun) ;; *) echo "::error::mode 不正: $M"; exit 1 ;; esac
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "モード: $M"

      # sat で採点対象が1件も無ければ weekly.py が exit 1（＝ブランチを作らない）
      - name: Build prompt
        run: python -X utf8 weekly.py --prompt-out PROMPT.txt ${{ steps.mode.outputs.mode }} docs/ai_weekly.json

      - name: Push prompt branch
        env:
          M: ${{ steps.mode.outputs.mode }}
        run: |
          D=$(TZ='Asia/Tokyo' date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f PROMPT.txt
          git commit -m "📝 週末版AIプロンプト ($D-$M)"
          git push -f origin "HEAD:refs/heads/ai-prompt/$D-$M"
          echo "push: ai-prompt/$D-$M"
          echo "----- PROMPT.txt -----"
          cat PROMPT.txt
