name: AI Weekly Prep (data → prompt branch)

# 本命は cron-worker からの dispatch（2026-10-07）。schedule は遅延する保険。

# 2026-10-05〜 週末版AIの前段（ai-morning-prep.yml と同じ型）。
#   routine のクラウド環境は外向きHTTPSが遮断されているため、データ取りとプロンプト作成はここで行う。
#   weekly.py --prompt-out の結果 PROMPT.txt をブランチ ai-prompt/YYYY-MM-DD-<sat|sun> に載せる。
#   routine はそれを checkout して回答（ai_answer.json）を書き、ai-weekly/YYYY-MM-DD-<mode> に push
#   → ai-weekly-ingest.yml が main へ取り込む。
#   古い ai-prompt/* の掃除は ai-morning-prep.yml が行う。
#
# GitHub cron の遅延対策で2回走らせる（2026-10-06: 6:05 の cron が 10:44 まで遅れ朝刊が欠番になった）。
#   2回目は push -f で上書きする。routine は ai-prompt/** への push で起動するので、
#   2回走っても routine 側で重複を弾く。
# コミットメッセージ1行目は「prompt: weekly YYYY-MM-DD sat|sun」に固定（routine が push イベントから種別を判別する）。
#
on:
  schedule:
    # 2026-10-10 週末版を土曜1本に統合（日曜版の定期実行は止めた）
    - cron: '40 22 * * 5'     # 22:40 UTC(金) = 7:40 JST(土)
    - cron: '0 23 * * 5'      # 23:00 UTC(金) = 8:00 JST(土)
  workflow_dispatch:
    inputs:
      mode:
        description: 'sat=週末版（答え合わせ＋来週の地図） / sun=旧日曜版'
        required: true
        default: 'sat'
      legacy_sun:
        description: '旧日曜版をあえて作るときだけ true（2026-10-10 に週末版へ統合済み）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: ai-weekly-prep
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decide mode
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          LEGACY_SUN: ${{ github.event.inputs.legacy_sun }}
        run: |
          M="$INPUT_MODE"
          if [ -z "$M" ]; then
            W=$(TZ='Asia/Tokyo' date +%u)   # 6=土, 7=日
            if [ "$W" = "6" ]; then M=sat; elif [ "$W" = "7" ]; then M=sun; else
              echo "::error::平日に起動されました（mode を指定してください）"; exit 1
            fi
          fi
          case "$M" in sat|sun) ;; *) echo "::error::mode 不正: $M"; exit 1 ;; esac
          # 日曜版は週末版（土曜）に統合した（2026-10-10）。cron-worker は日曜も mode=sun で起こしてくるので、
          # ここで何もせず終える。どうしても旧日曜版を作るときは legacy_sun=true で手動実行する
          if [ "$M" = "sun" ] && [ "$LEGACY_SUN" != "true" ]; then
            echo "日曜版は週末版に統合済み → 何もしない"; echo "mode=skip" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "モード: $M"

      # yfinance=世界の値動き・方向感の採点用の日経終値 / jpholiday=来週の休場日
      - name: Install dependencies
        if: steps.mode.outputs.mode != 'skip'
        run: pip install -q yfinance jpholiday

      # sat で採点対象が1件も無ければ weekly.py が exit 1（＝ブランチを作らない）
      - name: Build prompt
        if: steps.mode.outputs.mode != 'skip'
        run: python -X utf8 weekly.py --prompt-out PROMPT.txt ${{ steps.mode.outputs.mode }} docs/ai_weekly.json

      - name: Push prompt branch
        if: steps.mode.outputs.mode != 'skip'
        env:
          M: ${{ steps.mode.outputs.mode }}
        run: |
          D=$(TZ='Asia/Tokyo' date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f PROMPT.txt
          git commit -m "prompt: weekly $D $M"
          git push -f origin "HEAD:refs/heads/ai-prompt/$D-$M"
          echo "push: ai-prompt/$D-$M"
          echo "----- PROMPT.txt -----"
          cat PROMPT.txt
