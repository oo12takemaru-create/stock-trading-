name: Daily Trading Signal (v2.7.4)

on:
  schedule:
    - cron: '0 23 * * 0-4'
    - cron: '0 3 * * 1-5'
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - id: slot
        run: |
          JST_HOUR=$(TZ='Asia/Tokyo' date +%H)
          if [ "$JST_HOUR" -lt "10" ]; then
            echo "slot=Morning" >> $GITHUB_OUTPUT
            echo "slot_en=morning" >> $GITHUB_OUTPUT
          elif [ "$JST_HOUR" -lt "15" ]; then
            echo "slot=Midday" >> $GITHUB_OUTPUT
            echo "slot_en=midday" >> $GITHUB_OUTPUT
          else
            echo "slot=Evening" >> $GITHUB_OUTPUT
            echo "slot_en=evening" >> $GITHUB_OUTPUT
          fi
          echo "date_jst=$(TZ='Asia/Tokyo' date +%Y-%m-%d)" >> $GITHUB_OUTPUT
      - run: |
          python daily_scanner_v2_7_4.py --capital 1000000 --output signal.md --json-output signal.json
      - uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Signal ${{ steps.slot.outputs.date_jst }} ${{ steps.slot.outputs.slot }}"
          content-filepath: signal.md
          labels: |
            auto-signal
            ${{ steps.slot.outputs.slot_en }}
      - uses: actions/upload-artifact@v4
        with:
          name: signal-${{ steps.slot.outputs.date_jst }}-${{ steps.slot.outputs.slot_en }}
          path: |
            signal.md
            signal.json
      - run: python signal_logger.py signal.json signals_log.csv
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals_log.csv
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update signals_log.csv"
            git push
          fi
