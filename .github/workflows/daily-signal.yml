name: Daily Trading Signal (v2.8.1)

# 実行スケジュール: 月曜〜金曜の朝8:00 / 昼12:00 / 夕18:00 (JST)
# cronはUTC基準:
#   JST 08:00 = UTC 前日23:00  → cron: '0 23 * * 0-4' (日〜木 UTC = 月〜金 JST)
#   JST 12:00 = UTC 当日03:00  → cron: '0 3 * * 1-5' (月〜金 UTC = 月〜金 JST)
#   JST 18:00 = UTC 当日09:00  → cron: '0 9 * * 1-5' (月〜金 UTC = 月〜金 JST)
on:
  schedule:
    - cron: '0 23 * * 0-4'   # 朝 08:00 JST(月〜金)
    - cron: '0 3 * * 1-5'    # 昼 12:00 JST(月〜金)
    - cron: '0 9 * * 1-5'    # 夕 18:00 JST(月〜金)
    - cron: '30 10 * * 1-5'  # 予備: 夕方の本命(18:00 JST)の90分後(JST 19:30)。夕の回が起動しなかった日の保険
  workflow_dispatch:          # 手動実行も可能
    inputs:
      capital:
        description: '運用資金(円)'
        required: false
        default: '1000000'
      risk:
        description: '1トレードリスク(%)'
        required: false
        default: '1.0'

# GITHUB_TOKEN で Issue 作成・signals_log.csv コミットできるように権限付与
permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ★予備実行の冪等ガード（指示書 §14-2 / 引継ぎ.md §19「発見 2026-09-09」）
      #   本命 cron は起動しないことがある（2026-09-05 に実際に起きた）。
      #   その保険として予備 cron を置いているが、本命が動いた日に二重で走らせる
      #   必要はない。**当日ぶんが既にあるならここで打ち切る**。
      #   手動実行（workflow_dispatch）は意図的な再実行なのでスキップしない。
      - name: Skip if already fresh (予備実行のみ)
        id: guard
        run: |
          # ★このワークフローは朝(8:00)・昼(12:00)・夕(18:00)の1日3回動くのが正常。
          #   鮮度で判定してよいのは**予備の回だけ**。朝や昼の回でスキップすると
          #   本来の3回運用が壊れる（当日ぶんは朝の時点で既にあるため）。
          #   予備は JST 19:30 = UTC 10:30 に置いてあるので、その回だけ見る。
          HOUR_UTC=$(date -u +%H); MIN_UTC=$(date -u +%M)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "手動実行なのでスキップ判定をしません"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "is_backup=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # 予備の回（UTC 10:30 前後）以外は必ず実行する。
          # schedule は数時間遅れることがあるので、幅を持たせて 10〜13時台を予備とみなす
          if [ "$HOUR_UTC" -lt 10 ] || [ "$HOUR_UTC" -gt 13 ]; then
            echo "本命の回（朝/昼/夕）なので必ず実行します（UTC ${HOUR_UTC}:${MIN_UTC}）"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "is_backup=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # ここから先は予備の回。人に届くもの（Issue）は出さない。
          echo "is_backup=true" >> $GITHUB_OUTPUT
          if python check_freshness.py --target signals_log; then
            echo "当日ぶんは取得済み。以降のステップを飛ばします"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "未取得または古いので実行します"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine time slot (朝/昼/夕)
        if: steps.guard.outputs.skip != 'true'
        id: slot
        run: |
          JST_HOUR=$(TZ='Asia/Tokyo' date +%H)
          if [ "$JST_HOUR" -lt "10" ]; then
            echo "slot=🌅 朝" >> $GITHUB_OUTPUT
            echo "slot_en=morning" >> $GITHUB_OUTPUT
          elif [ "$JST_HOUR" -lt "15" ]; then
            echo "slot=☀️ 昼" >> $GITHUB_OUTPUT
            echo "slot_en=midday" >> $GITHUB_OUTPUT
          else
            echo "slot=🌙 夕" >> $GITHUB_OUTPUT
            echo "slot_en=evening" >> $GITHUB_OUTPUT
          fi
          echo "date_jst=$(TZ='Asia/Tokyo' date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "time_jst=$(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      # ★2026-07-22: v2.7系→v2.8.0へ差し替え(341銘柄・サンバイオ除外・ナイフガード・
      #   セクター別リスク調整)。CLIは完全互換。ザラ場通知/朝ダイジェストと同一ロジックに統一。
      - name: Run Daily Scanner v2.8.1(新高値型フィルタ)
        if: steps.guard.outputs.skip != 'true'
        env:
          CAPITAL: ${{ github.event.inputs.capital || '1000000' }}
          RISK:    ${{ github.event.inputs.risk || '1.0' }}
        run: |
          python daily_scanner_v2_8_0.py \
            --capital "$CAPITAL" \
            --risk "$RISK" \
            --output signal.md \
            --json-output signal.json

      - name: Add timestamp header
        if: steps.guard.outputs.skip != 'true'
        run: |
          cat > signal_final.md <<HEADER
          > ⏰ 自動実行: ${{ steps.slot.outputs.time_jst }} JST (${{ steps.slot.outputs.slot }})
          > 📦 v2.8.0 341銘柄版 | GitHub Actions run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          HEADER
          cat signal.md >> signal_final.md

      # ★予備の回では作らない（Fable 2026-09-09）
      #   このワークフローにメール送信・X投稿・realtime_notifier は無い
      #   （それらは morning-digest.yml / realtime-signal.yml / ai-analysis.yml が
      #     それぞれ独自の cron で持っている）。
      #   daily-signal で人に届くのはこの Issue だけなので、ここを止める。
      #   予備は本命が落ちた日にしか動かないので二重にはならないはずだが、
      #   **二重通知は欠落より悪い**ので、はずれても害の無い側に倒す。
      #   JSON・artifact・signals_log.csv は予備でも作る（データは欠かさない）。
      - name: Create or update today's signal issue
        if: steps.guard.outputs.skip != 'true' && steps.guard.outputs.is_backup != 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "📊 シグナル ${{ steps.slot.outputs.date_jst }} ${{ steps.slot.outputs.slot }}"
          content-filepath: signal_final.md
          labels: |
            auto-signal
            ${{ steps.slot.outputs.slot_en }}

      - name: Upload signal artifacts
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signal-${{ steps.slot.outputs.date_jst }}-${{ steps.slot.outputs.slot_en }}
          path: |
            signal.md
            signal.json
          retention-days: 30

      # ★新機能: シグナル履歴を signals_log.csv に追記
      - name: Append to signals_log.csv
        if: steps.guard.outputs.skip != 'true'
        run: |
          python signal_logger.py signal.json signals_log.csv

      # ★2026-07-22: lost-update対策(realtime-signal.ymlと同方式)。
      #   旧実装は他コミットと衝突するとpush失敗でシグナル行が消失(7/13の教訓)。
      - name: Commit signals_log.csv (行を失わないマージ+リトライ)
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals_log.csv
          if git diff --staged --quiet; then
            echo "変更なし(全て既存シグナル)"
            exit 0
          fi
          cp signals_log.csv /tmp/ours_signals.csv
          git reset --hard HEAD
          for i in 1 2 3 4 5; do
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            python merge_signals_log.py /tmp/ours_signals.csv signals_log.csv
            git add signals_log.csv
            if git diff --staged --quiet; then
              echo "リモートに反映済み → 完了"
              exit 0
            fi
            git commit -m "📊 Update signals_log.csv (${{ steps.slot.outputs.date_jst }} ${{ steps.slot.outputs.slot }})"
            if git push; then
              echo "✓ signals_log.csv を更新(試行${i}回目で成功)"
              exit 0
            fi
            echo "push失敗(試行${i}/5) → リモート最新で再マージして再試行"
            sleep 7
          done
          echo "::error::5回試行してもpushできず。シグナル行(末尾5行):"
          tail -5 /tmp/ours_signals.csv
          exit 1

      - name: Write summary
        if: steps.guard.outputs.skip != 'true'
        run: |
          echo "## 📊 デイリースキャナー v2.8.0 実行完了" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ⏰ 実行時刻: ${{ steps.slot.outputs.time_jst }} JST" >> $GITHUB_STEP_SUMMARY
          echo "- 🏷️ タイムスロット: ${{ steps.slot.outputs.slot }}" >> $GITHUB_STEP_SUMMARY
          echo "- 💰 運用資金: ¥${{ env.CAPITAL || '1000000' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat signal.md >> $GITHUB_STEP_SUMMARY
