name: Free Scanner (無料版BNFスキャナー)

# 平日 19:30 JST に実行 (UTC 10:30)。
# 無料版は1営業日遅れのデータなので、GitHubのcron遅延があっても実害なし。
on:
  schedule:
    # ★3時間前倒し（2026-09-09 Fable 相談⑧）★
    # GitHub Actions の schedule は**常時2〜5時間遅れる**（19本すべてで観測。
    # 中央値 free-scanner 192分・precompute-daily 277分）。分をずらしても効かない。
    # 狙いの JST 19:30 に走らせるため、予定は JST 16:30 に置く。
    # 遅延が小さい日でも大引け（15:00 JST）の後なので終値は確定している。
    - cron: '30 7 * * 1-5'
    - cron: '30 11 * * 1-5'  # 予備: 本命の60分後(JST 20:30)。本命が起動しなかった日の保険
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ★予備実行の冪等ガード（指示書 §14-2 / 引継ぎ.md §19「発見 2026-09-09」）
      #   本命 cron は起動しないことがある（2026-09-05 に実際に起きた）。
      #   その保険として予備 cron を置いているが、本命が動いた日に二重で走らせる
      #   必要はない。**当日ぶんが既にあるならここで打ち切る**。
      #   手動実行（workflow_dispatch）は意図的な再実行なのでスキップしない。
      - name: Skip if already fresh (予備実行のみ)
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "手動実行なのでスキップ判定をしません"
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if python check_freshness.py --target free_scanner; then
            echo "当日ぶんは取得済み。以降のステップを飛ばします"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "未取得または古いので実行します"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run free scanner
        if: steps.guard.outputs.skip != 'true'
        run: |
          python scanner_free.py --output docs/free_scanner.json

      - name: Commit free_scanner.json
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/free_scanner.json docs/market_jiai.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "無料版スキャナー結果を更新"
            # 他ワークフローの同時pushと衝突しても失敗しないよう取り込んでからpush
            git pull --rebase origin main
            git push
          fi

      - name: Write summary
        if: steps.guard.outputs.skip != 'true'
        run: |
          echo "## 無料版スキャナー実行完了" >> $GITHUB_STEP_SUMMARY
          python - >> $GITHUB_STEP_SUMMARY <<'PY'
          import json
          d = json.load(open('docs/free_scanner.json', encoding='utf-8'))
          n = sum(1 for r in d['rows'] if r['judge'] == 'signal')
          print(f"- 対象営業日: {d['target_date']} / 地合い: {d['jiai']} / 乖離シグナル: {n}件")
          if 'signals_today_count' in d:
              sod = d.get('signal_of_day')
              one = f"{sod['code']} {sod['name']} ({sod['strategy_label']})" if sod else "なし(当日初出なし)"
              print(f"- 本番シグナル {d['signals_today_date']}: {d['signals_today_count']}件 / 公開1件: {one}")
          else:
              print("- ⚠ signals_log.csv が読めず signal_of_day は未出力")
          PY
