name: Kessan Flash (kaburadar.jp)

# 決算短信の数字を当日中に出す（株レーダー エンジン②）。
#   tdnet_list.py  : TDnetの当日一覧を貯める → docs/tdnet_list.json（直近10営業日・値動き③と共用）
#   kessan_flash.py: 決算短信のXBRLから数字を抜く → docs/kessan_flash.json（直近60日）
#                                                 → docs/kessan_flash_hist/YYYY-MM.json（月別・追記のみ）
#                  （同じzipから配当の状況）        → docs/dividend_hist/YYYY-MM.jsonl（月別・追記のみ・表示はまだしない）
#   fc_revision.py : 業績予想・配当予想の修正の XBRL（0912 の zip）から修正前→修正後と向き → docs/fc_revision/YYYY-MM.json
#                    XBRL の無い修正の開示は PDF の表を読む（fc_revision_pdf.py・検算が合ったものだけ・1件ずつ1秒あける）
#                    tdnet_hist・tdnet_list.json の該当行に rv を足す（2026-11-12・足すだけ）
# TDnetの一覧は約1か月で消えるので、月別履歴が資産になる。
#
# 15:00の決算集中に合わせて 15:30 / 16:30 / 18:30 JST の3回。
# daily-signal.yml には一切触らない。
on:
  schedule:
    - cron: '30 6,7,9 * * 1-5'   # 06:30/07:30/09:30 UTC = 15:30/16:30/18:30 JST（平日）
  workflow_dispatch:
    inputs:
      dates:
        description: '取り込む日（YYYY-MM-DD を空白区切りで複数可。空なら当日）。検証やバックフィル用'
        required: false
        default: ''
      fc_backfill:
        description: '業績修正の向き（fc_revision.py）を直近N営業日さかのぼって読む（空なら当日ぶんだけ）。TDnet は約1か月で消える'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: kessan-flash
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ★main のルールセットを通すため deploy key で checkout する★
          #   bypass に入れられるのは Deploy key だけなので、GITHUB_TOKEN の
          #   push（github-actions[bot]）は「PR 必須」に弾かれる。
          #   ★DEPLOY_KEY が未設定なら空文字＝無視され、今までどおり token で動く。★
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 決算速報は標準ライブラリだけで動く。PyMuPDF は業績修正の PDF を読むためだけ（2026-11-12）。
      # 入らなくても止めない（fc_revision.py は XBRL だけで動く）
      - name: Install PyMuPDF
        run: pip install -q pymupdf || echo "::warning::PyMuPDF を入れられなかった（業績修正の PDF は読まない）"

      - name: Test parser
        run: |
          python -X utf8 tests/test_kessan_flash.py
          python -X utf8 tests/test_fc_revision.py
          python -X utf8 tests/test_fc_revision_pdf.py

      - name: Fetch TDnet list
        env:
          DATES: ${{ github.event.inputs.dates }}
        run: |
          # 取れなくても前回のファイルは残る（tdnet_list.py が空で上書きしない）。
          # その場合も kessan_flash.py は手元の一覧で動けるので、ここでは止めない
          python -X utf8 tdnet_list.py $DATES || echo "::warning::TDnetの一覧を取得できなかった（前回分で続行）"

      - name: Build kessan_flash
        env:
          DATES: ${{ github.event.inputs.dates }}
        run: python -X utf8 kessan_flash.py $DATES

      - name: Read forecast revisions (XBRL / PDF)
        env:
          DATES: ${{ github.event.inputs.dates }}
          FC_BACKFILL: ${{ github.event.inputs.fc_backfill }}
        run: |
          # 失敗しても決算速報は公開する（rv が無くてもサイトは今までどおり動く）
          python -X utf8 fc_revision.py ${FC_BACKFILL:+--backfill $FC_BACKFILL} $DATES || echo "::warning::fc_revision.py が失敗（決算速報は公開する）"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/tdnet_list.json docs/kessan_flash.json docs/kessan_flash_hist/ docs/dividend_hist/
          git add -f docs/tdnet_hist/ 2>/dev/null || true   # 日ごとの開示の記録（2026-11-11・無い回は飛ばす）
          git add -f docs/fc_revision/ 2>/dev/null || true  # 業績・配当予想の修正前→修正後（2026-11-12・無い回は飛ばす）
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "📈 決算速報を更新 ($(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M'))"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push 再試行 $i"
            sleep $((i * 5))
          done
          exit 1
