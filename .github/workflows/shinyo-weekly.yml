name: Shinyo Weekly (kaburadar.jp)

# JPX「信用取引現在高」を取得して docs/shinyo.json に公開
# 金曜申込み分が翌週火曜ごろ公表されるので、火・水・木の夕方にまわして取り逃しを防ぐ。
# JPXは直近5週分しか置いていないため、docs/shinyo_state.json に履歴を蓄積し続ける。
# JST 19:07 = UTC 10:07
on:
  schedule:
    # 2026-09-25 から銘柄別の信用残は日次公表（JPX margin/01.html・16:00目安）。
    # 平日 17:00 JST と、遅れた日のための 18:00 JST。2回目は取得済みなら何もしない
    - cron: '0 8 * * 1-5'
    - cron: '0 9 * * 1-5'
  # pipeline-*.yml から順序付きで呼べるようにする（2026-09-09・実行基盤）
  # 既存の schedule / workflow_dispatch はそのまま残す
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shinyo-weekly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ★main のルールセットを通すため deploy key で checkout する★
          #   bypass に入れられるのは Deploy key だけなので、GITHUB_TOKEN の
          #   push（github-actions[bot]）は「PR 必須」に弾かれる。
          #   ★DEPLOY_KEY が未設定なら空文字＝無視され、今までどおり token で動く。★
          #   （actions/checkout は ssh-key が空なら token 経路に落ちる）
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -q pandas xlrd pymupdf

      - name: Build shinyo.json
        run: python shinyo_fetch.py

      # 銘柄別の週末残高（PDF公表）。市場全体とは別ファイル・別スクリプト。
      # こちらが失敗しても shinyo.json の公開は止めない
      # ★失敗を warning で握りつぶさない★
      #   以前は `|| echo warning` で、JPXのページ構成が変わったあと2週間 success のまま
      #   止まっていた（2026-09-25〜10-05）。市場全体の shinyo.json は公開したいので
      #   この段は先へ進め、コミットのあとでジョブを失敗にする。
      - name: Build shinyo_meigara.json (日次)
        id: meigara
        continue-on-error: true
        run: python shinmei_fetch.py


      - name: Commit shinyo.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/shinyo.json docs/shinyo_state.json docs/shinyo_meigara.json                      docs/shinyo_daily.json docs/shinyo_daily/
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "💳 信用取引の需給を更新"
          git pull --rebase origin main
          git push

      - name: Fail if shinyo_meigara failed
        if: steps.meigara.outcome == 'failure'
        run: |
          echo "::error::銘柄別の信用残を取り込めませんでした。上の Build shinyo_meigara.json のログに理由があります"
          exit 1
