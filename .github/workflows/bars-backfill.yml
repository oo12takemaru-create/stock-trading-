name: Bars Backfill (1 year, manual once)

# 過去1年分の全銘柄の日足を「遡って取った分」として data/bars_backfill/YYYY-MM.csv.gz に1回だけ書く（2026-11-18）。
# 当日記録（movers-daily.yml の daily_bars.py → data/bars/）とは混ぜない。各行に origin=backfill。
# 手動実行のみ（定期実行なし）。もう書いてあれば何もしない（bars_backfill.py が判定）。
# 所要は約15分（movers_daily.py と同じ取り方）。movers-daily と同じ時間帯は避けて走らせる。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bars-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # main のルールセットを通すため deploy key で checkout する（movers-daily.yml と同じ）
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas openpyxl

      - name: Backfill 1 year
        run: python -X utf8 bars_backfill.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/bars_backfill
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "🗂 全銘柄の日足 過去1年分（backfill）"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && { echo "✓ push 成功（試行${i}回目）"; exit 0; }
            echo "push 失敗。${i}回目のリトライ待ち"
            sleep $((i * 10))
          done
          echo "::error::push に5回失敗しました"
          exit 1
