name: AI Morning Ingest (routine → main)

# 2026-10-05〜 AI朝刊の本番経路。
#   文章は Claude Code の定期実行（routine）が書き、ブランチ ai-morning/YYYY-MM-DD に
#   ai_answer.json（AIの回答JSONだけ）/ docs/score3.json / inputs.txt を push する。
#   この push をトリガに、ここで main を deploy key で checkout し、3ファイルを取り込んで
#   検証（validate・上方修正の禁止）→ X画像 → main へコミット → ntfy → ブランチ削除 を行う。
#   routine は main に直接 push できない（ルールセット: PR必須、Deploy key のみバイパス）ため。
#
# 回答が不正なら ai_analysis.py が exit 2 で落ち、ブランチは調査用に残る。
# モデル表記: ブランチ先頭コミットのメッセージに「model=Claude Fable 5.1 (Claude Code 定期実行)」
#   のように書けばそれを使う。無ければ ai_analysis.py の既定（Claude (Claude Code 定期実行)）。
on:
  push:
    branches: ['ai-morning/**']
  workflow_dispatch:
    inputs:
      branch:
        description: '取り込むブランチ名（例: ai-morning/2026-10-06）'
        required: true

permissions:
  contents: write

concurrency:
  group: ai-analysis          # ai-analysis.yml と同じ。同時に朝刊を書かない
  cancel-in-progress: false

jobs:
  ingest:
    # ブランチ削除の push では動かさない
    if: github.event_name == 'workflow_dispatch' || github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve branch
        id: br
        env:
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then BR="$INPUT_BRANCH"; else BR="$REF_NAME"; fi
          if ! printf '%s' "$BR" | grep -Eq '^ai-morning/[A-Za-z0-9._-]+$'; then
            echo "::error::ブランチ名が規則(ai-morning/...)に合いません: $BR"; exit 1
          fi
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
          echo "取り込むブランチ: $BR"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # ★main のルールセットを通すため deploy key で checkout する（ai-analysis.yml と同じ）★
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Take 3 files from the branch
        id: take
        env:
          BR: ${{ steps.br.outputs.branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BR:refs/remotes/origin/$BR"
          for f in ai_answer.json docs/score3.json inputs.txt; do
            if ! git cat-file -e "origin/$BR:$f" 2>/dev/null; then
              echo "::error::ブランチ $BR に $f がありません"; exit 1
            fi
            mkdir -p "$(dirname "$f")"
            git show "origin/$BR:$f" > "$f"
            echo "取り込み: $f ($(wc -c < "$f") bytes)"
          done
          # ブランチ先頭コミットのメッセージに model=... があればモデル表記に使う
          LABEL=$(git log -1 --format=%B "origin/$BR" | sed -n 's/.*model=\(.*\)$/\1/p' | head -1 | tr -d '\r')
          echo "model_label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "model_label: ${LABEL:-（既定）}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      # 検証（validate）→ 上方修正の禁止 → 書き出し。回答不正なら exit 2
      - name: Ingest AI answer
        env:
          MODEL_LABEL: ${{ steps.take.outputs.model_label }}
        run: |
          set +e
          python -X utf8 ai_analysis.py --answer ai_answer.json --model-label "$MODEL_LABEL" docs/ai_analysis.json
          rc=$?
          if [ $rc -eq 2 ]; then echo "::error::回答不正（ai_answer.json が検証に落ちた）。理由は上のログ。ブランチは残す"; fi
          exit $rc

      - name: Build X post text and image
        continue-on-error: true    # 投稿素材の失敗で朝刊の公開を止めない
        run: |
          python -X utf8 make_x_post.py docs/ai_analysis.json inputs.txt docs/x
          echo "----- 本文 -----"
          cat docs/x/x_post.txt

      - name: Commit ai_analysis.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/ai_analysis.json docs/score3.json docs/x/x_card.png docs/x/x_post.txt
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "🤖 AI相場分析を更新 ($(TZ='Asia/Tokyo' date +%Y-%m-%d))"
          # score3-daily.yml が先に score3.json をコミットしていた場合は、朝刊と対になる
          # こちらの score3.json を優先する（rebase 中の theirs = いま載せ直すコミット側）
          git pull --rebase -X theirs origin main
          git push origin HEAD:main

      - name: Notify (ntfy)
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC未設定のためスキップ"; exit 0; fi
          python - <<'PY'
          import json, os, urllib.request
          d = json.load(open("docs/ai_analysis.json", encoding="utf-8"))["latest"]
          body = open("docs/x/x_post.txt", encoding="utf-8").read() if os.path.exists("docs/x/x_post.txt") else d["headline"]
          urllib.request.urlopen(urllib.request.Request(
              "https://ntfy.sh",
              data=json.dumps({
                  "topic": os.environ["NTFY_TOPIC"],
                  "title": f"AI朝刊 {d['date']}",
                  "message": body[:1200],
                  "click": "https://oo12takemaru-create.github.io/stock-trading-/x/x_card.png",
              }).encode("utf-8"),
              headers={"Content-Type": "application/json"}), timeout=30)
          print("ntfy送信OK")
          PY

      # 成功したときだけ作業ブランチを消す（失敗時は調査用に残す）
      - name: Delete work branch
        if: success()
        env:
          BR: ${{ steps.br.outputs.branch }}
        run: git push origin --delete "$BR"
