name: Precompute Metrics (月初・全期間)

# 月に1回、全銘柄×10年を取り直して前計算テーブルを作り直す。
# yfinance の調整済み株価は分割・配当で過去にさかのぼって変わるため、
# 日次差分だけでは古い行がずれたままになる。それを月1回まとめて直す。
#   毎月1日 UTC 20:00 = 翌2日 JST 05:00
on:
  schedule:
    - cron: '0 20 1 * *'
  workflow_dispatch:
    inputs:
      years:
        description: '何年ぶん計算するか'
        required: false
        default: '10'

permissions:
  contents: write

concurrency:
  group: precompute-metrics
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ★main のルールセットを通すため deploy key で checkout する★
          #   bypass に入れられるのは Deploy key だけなので、GITHUB_TOKEN の
          #   push（github-actions[bot]）は「PR 必須」に弾かれる。
          #   ★DEPLOY_KEY が未設定なら空文字＝無視され、今までどおり token で動く。★
          #   （actions/checkout は ssh-key が空なら token 経路に落ちる）
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild daily_metrics / market_condition / sectors
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # ★ python ... | tee は tee の終了コードになるので、失敗が success になる。
          #    pipefail を付けて Python の失敗をそのまま落とす（2026-09-06 に実際に踏んだ）。
          set -o pipefail
          python precompute/build_metrics.py \
            --years "${{ github.event.inputs.years || '10' }}" \
            | tee build.log

      - name: Rebuild preset portfolio result
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # ★ python ... | tee は tee の終了コードになるので、失敗が success になる。
          #    pipefail を付けて Python の失敗をそのまま落とす（2026-09-06 に実際に踏んだ）。
          set -o pipefail
          python precompute/build_portfolio.py | tee -a build.log

      # 規定値の調整域（企画書v2 §4-2 の1,260通り）を先に計算しておく。
      # 会員がスライダーを動かした瞬間に返るのはこの範囲（引継ぎ.md §19 相談④）。
      # ★キャッシュのキーは TypeScript 側（params.ts）と一致している必要がある。
      #   ズレるとエラーにならず「毎回遅い」だけなので、
      #   precompute/tests/verify_cache_key.py で確かめること。
      # ★順序（2026-09-06 Fable）★
      # 公開数字の JSON は、調整域のキャッシュ温めに依存させない。
      # 月次は全期間の再計算のあとなので、まず JSON を出してから温める。
      # （温めは「再計算 → 温め直し」の順を守る必要があるので、月次でも最後）
      # 公開数字を1枚の JSON にして GitHub Pages で配る。
      # 静的サイト（ruletrade.jp）と会員アプリ /dashboard がこの同じ値を見る
      # ＝「一つの定義・一つの数字」（引継ぎ.md §19・起動文 2-4c）。
      - name: Publish portfolio_stats.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            python precompute/export_portfolio_json.py
            git add -f docs/portfolio_stats.json
            if git diff --staged --quiet; then
              echo "変更なし → 完了"
              exit 0
            fi
            git commit -m "📊 公開数字を更新（portfolio_stats.json）"
            if git push; then
              echo "✓ 公開成功（試行${i}回目）"
              exit 0
            fi
            echo "push失敗（試行${i}/3）→ 再試行"
            sleep 7
          done
          echo "::error::3回試行してもpushできませんでした"
          exit 1

      # ── トップの「閾値を変えたらどうなるか」の3行（引継ぎ.md §29-1）──
      #
      # ★なぜ月次か★
      #   日々わずかに動く数字で、訴求の中身は変わらない。毎日回すとキャッシュが
      #   空のとき8秒×3本ぶん無駄になる。月1回で足りる（Fable 2026-09-15）。
      #
      # ★なぜ会員アプリのスクリプトを使うか★
      #   /rules の画面と**同じ経路**（lib/backtest/cached.ts）で計算するため。
      #   Python 側に同じ計算を書き直すと、サイトと画面で数字が食い違う日が来る。
      #   そのために Private リポジトリ ruletrade-app を checkout する
      #   （GH_PAT の使い方は morning-digest.yml が stock-trading-private を
      #     取っているのと同じ）。
      - name: Checkout ruletrade-app (計算は画面と同じ経路で行う)
        uses: actions/checkout@v4
        with:
          repository: oo12takemaru-create/ruletrade-app
          token: ${{ secrets.GH_PAT }}
          path: _app

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish builder_example.json
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          # スクリプトは .env.local を読む作りなので env から組み立てて渡す。
          # 値は表示しない。使い終わったら消す。
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
          } > _app/.env.local
          ( cd _app && npm ci --no-audit --no-fund && npx tsx scripts/calc-builder-example.ts )
          rm -f _app/.env.local
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/builder_example.json
          if git diff --staged --quiet; then
            echo "変更なし → 完了"
            exit 0
          fi
          git commit -m "📈 閾値を変えた場合の比較を更新（builder_example.json）"
          for i in 1 2 3; do
            if git push; then
              echo "✓ 公開成功（試行${i}回目）"
              exit 0
            fi
            echo "push失敗（試行${i}/3）→ 取り込んで再試行"
            git pull --rebase origin ${{ github.ref_name }} || true
            sleep 7
          done
          echo "::error::3回試行してもpushできませんでした"
          exit 1

      # ── 調整域のキャッシュ温めは **止めてある**（2026-09-10・§23 相談⑪ 案A）──
      # 日次（precompute-daily.yml）と同じ理由。あちらだけ止めても、月初にここで
      # 185〜600MB を使ってしまい対策が中途半端になるので揃えて止める。
      # 戻すときは日次と一緒に、両方のコメントを外す。
      # - name: Warm preset adjustment cache
      #   env:
      #     SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      #     SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      #   run: |
      #     set -o pipefail
      #     python precompute/warm_cache.py | tee -a build.log

      - name: Write summary
        if: always()
        run: |
          echo "## 前計算テーブル 全期間の再計算" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 実行時刻: $(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M') JST" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -30 build.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precompute-build-log
          path: build.log
          retention-days: 30
