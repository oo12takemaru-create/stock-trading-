name: AI Market Analysis (kaburadar.jp)

# 毎朝 6:25 JST (月〜金) に AI相場分析を生成して docs/ai_analysis.json に公開
# JST 06:25 = UTC 前日21:25 → cron '25 21 * * 0-4' (日〜木 UTC = 月〜金 JST)
# ※ :00 / :30 はGitHub側が混雑して遅延しやすいため、あえて外した時刻にしている
#
# APIキーは ANTHROPIC_API_KEY を優先し、無ければ GEMINI_API_KEY を使う。
# どちらか一方をリポジトリのSecretsに登録すれば動く。
on:
  schedule:
    - cron: '25 21 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Generate AI analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 任意: リポジトリ変数 ANTHROPIC_MODEL でモデルを差し替え
          # (未設定なら claude-opus-5。安くしたい場合は claude-sonnet-5 など)
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          python ai_analysis.py docs/ai_analysis.json

      - name: Commit ai_analysis.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/ai_analysis.json
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "🤖 AI相場分析を更新 ($(TZ='Asia/Tokyo' date +%Y-%m-%d))"
          git pull --rebase origin main
          git push
