name: AI Market Analysis (kaburadar.jp)

# 通常は「PCを朝スリープ解除 → Claude Codeの定期タスクが生成」で運用している。
# 本ワークフローは手動実行のバックアップ(PCが動かせない日・旅行中など)。
#
# 使うには ANTHROPIC_API_KEY か GEMINI_API_KEY をSecretsに登録してから
# Actionsタブで手動実行する。キー未登録のまま自動実行すると毎朝失敗するので、
# スケジュールはあえて設定していない。
# 自動化したくなったら次の行を on: の下に足す(平日6:25 JST):
#   schedule:
#     - cron: '25 21 * * 0-4'
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Generate AI analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 任意: リポジトリ変数 ANTHROPIC_MODEL でモデルを差し替え
          # (未設定なら claude-opus-5。安くしたい場合は claude-sonnet-5 など)
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          python ai_analysis.py docs/ai_analysis.json

      - name: Commit ai_analysis.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/ai_analysis.json
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "🤖 AI相場分析を更新 ($(TZ='Asia/Tokyo' date +%Y-%m-%d))"
          git pull --rebase origin main
          git push
