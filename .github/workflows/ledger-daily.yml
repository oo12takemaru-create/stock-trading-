name: Ledger Daily (シグナル台帳)

# 株レーダーの判定を docs/ledger/YYYY-MM.jsonl に記録し（ledger.py）、
# 翌営業日始値からの r5/r20/r60 を埋める（ledger_score.py）。公開ページは作らない。
# 起動文: kaburadar\起動文_実務_積上①_台帳と運用土台_2026-10-07.md
#
# 平日 19:30 JST に cron-worker（Cloudflare）から dispatch する。
# 18:00 のパイプライン（無料スキャナー・温度計など）と 18:30 の値動き（movers-daily）の後。
# GitHub の schedule は保険（2〜5時間遅れるのが普通）。二重に走っても台帳は自然キーで弾くので害はない。
on:
  schedule:
    - cron: '40 9 * * 1-5'     # 18:40 JST（保険・実際は遅れて走る）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger-daily
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ★main のルールセットを通すため deploy key で checkout する（heatmap.yml の注記参照）★
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          # 空売りの新規報告・十倍株の差分は git の過去の版を読む
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Record (追記のみ)
        run: python -X utf8 ledger.py

      - name: Score (r5/r20/r60)
        run: python -X utf8 ledger_score.py

      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ledger
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "📒 シグナル台帳を更新"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && { echo "✓ push 成功（試行${i}回目）"; exit 0; }
            echo "push 失敗。${i}回目のリトライ待ち"
            sleep $((i * 10))
          done
          echo "::error::push に5回失敗しました"
          exit 1
