name: Kessan Daily (kaburadar.jp)

# JPXの決算発表予定日を毎日取得して docs/kessan.json に公開
# 予定日は会社の都合で前後するので毎日取り直す。
# 朝と夕方の2回。GitHubの無料枠cronは2.5〜3時間遅れることがあるため丸い分を避ける。
# JST 07:43 = UTC 前日22:43 / JST 18:43 = UTC 09:43
on:
  schedule:
    - cron: '43 22 * * 0-4'
    - cron: '43 9 * * 1-5'
  # pipeline-*.yml から順序付きで呼べるようにする（2026-09-09・実行基盤）
  # 既存の schedule / workflow_dispatch はそのまま残す
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kessan-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ★main のルールセットを通すため deploy key で checkout する★
          #   bypass に入れられるのは Deploy key だけなので、GITHUB_TOKEN の
          #   push（github-actions[bot]）は「PR 必須」に弾かれる。
          #   ★DEPLOY_KEY が未設定なら空文字＝無視され、今までどおり token で動く。★
          #   （actions/checkout は ssh-key が空なら token 経路に落ちる）
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        # yfinanceはスキャナーの銘柄リスト(主要フラグ)のimportに必要
        run: pip install -q pandas openpyxl yfinance

      - name: Build kessan.json
        run: python kessan_fetch.py

      # 決算発表予定の全社を日付ごとに残す（サイトの kessan-yotei/YYYY-MM-DD.html・2026-11-11）。
      # kessan.json は過ぎた日を主要銘柄だけに縮めるので、過ぎる前の全社をここに置く。失敗しても kessan.json は出す
      - name: Keep kessan schedule history
        run: python -X utf8 kessan_yotei_hist.py || echo "::warning::kessan_yotei_hist.py が失敗（kessan.json は公開する）"

      - name: Commit kessan.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/kessan.json
          git add -f docs/kessan_yotei_hist/ 2>/dev/null || true   # 日付つき一覧の材料（2026-11-11・無い回は飛ばす）
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "📅 決算発表予定を更新"
          git pull --rebase origin main
          git push
