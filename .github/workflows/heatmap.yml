name: Heatmap (kaburadar.jp)

# 日本株ヒートマップ用データを平日3回(10:00/12:45/15:45 JST)更新 → docs/heatmap.json
# JST 10:00 = UTC 01:00 / JST 12:45 = UTC 03:45 / JST 15:45 = UTC 06:45
on:
  schedule:
    - cron: '0 1 * * 1-5'
    - cron: '45 3 * * 1-5'
    - cron: '45 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch heatmap data
        run: python heatmap_fetch.py docs/heatmap.json

      - name: Commit heatmap.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/heatmap.json
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "🗾 ヒートマップデータを更新"
          git pull --rebase origin main
          git push
