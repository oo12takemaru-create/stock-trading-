name: Heatmap (kaburadar.jp)

# 日本株ヒートマップ用データを平日6回更新 → docs/heatmap.json
# ★GitHub Actionsの定時実行は混雑時に2〜3時間遅延することがあるため、
#   (a)キリの良い分を避ける (b)回数を増やして「その日の更新が必ず入る」ようにする
#   の2点で対策している。1回あたり約45秒。
# JST = UTC+9 / 東証は 9:00-15:30 JST
on:
  schedule:
    - cron: '3 0 * * 1-5'    # 09:03 JST 寄り付き直後
    - cron: '23 1 * * 1-5'   # 10:23 JST
    - cron: '23 3 * * 1-5'   # 12:23 JST 後場寄り
    - cron: '23 5 * * 1-5'   # 14:23 JST
    - cron: '3 7 * * 1-5'    # 16:03 JST 大引け後(確定値)
    - cron: '3 10 * * 1-5'   # 19:03 JST 保険(遅延時の取りこぼし防止)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch heatmap data
        run: python heatmap_fetch.py docs/heatmap.json

      - name: Commit heatmap.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/heatmap.json
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "🗾 ヒートマップデータを更新"
          git pull --rebase origin main
          git push
