name: Karauri Daily (kaburadar.jp)

# JPXの空売り残高報告を毎営業日集計して docs/karauri.json に公開
# JPXの公表は夕方(16:30頃)。GitHubの無料枠cronは2.5〜3時間遅れることがあるため
# 夕方2回＋翌朝1回まわして取り逃しを防ぐ。丸い分を避ける。
# JST 17:37 = UTC 08:37 / JST 20:37 = UTC 11:37 / JST 07:37 = UTC 前日22:37
on:
  schedule:
    - cron: '37 8 * * 1-5'
    - cron: '37 11 * * 1-5'
    - cron: '37 22 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: karauri-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -q pandas xlrd

      - name: Build karauri.json
        run: python karauri_fetch.py

      - name: Commit karauri.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/karauri.json docs/karauri_state.json
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "📉 空売り残高を更新"
          git pull --rebase origin main
          git push
