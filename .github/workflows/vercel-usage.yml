name: Vercel Usage Watch (関数のCPU)

# 2026-10-23: kaburadar の OG 画像の関数が Vercel の CPU 枠（Fluid Active CPU）を使い切り、チーム全体が停止した。
# 月の累計（チーム全プロジェクト）が 3・6・9・12 時間の段階を初めて超えた日にだけ ntfy で1通。毎日 09:10 JST（= 00:10 UTC）。
# 越えていない日は送らない。送った段階は Actions のキャッシュ（.vercel-usage-state.json）で持ち越し、月が変わればやり直す。
# 必要な Secrets: VERCEL_TOKEN（Vercel のチーム team_w3H2B1scUBhauPvE1drtRVpA のトークン）・NTFY_TOPIC（既存）
on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      test_notify:
        description: 'テスト用: しきい値に関係なく ntfy を1通送る（1 を入れる）'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore notified steps
        uses: actions/cache/restore@v4
        with:
          path: .vercel-usage-state.json
          key: vercel-usage-state-${{ github.run_id }}
          restore-keys: vercel-usage-state-

      - name: Watch Vercel function CPU
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ inputs.test_notify }}
        run: python -X utf8 vercel_usage_watch.py

      - name: Save notified steps
        if: always() && hashFiles('.vercel-usage-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .vercel-usage-state.json
          key: vercel-usage-state-${{ github.run_id }}
